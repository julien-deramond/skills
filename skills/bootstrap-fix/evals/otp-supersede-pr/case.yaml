schema_version: "1.1"
name: otp-supersede-pr
expected_outcome: |
  Request: a competing PR that supersedes a contributor's OTP input fix, with the contributor as co-author.
  The fix keeps the readonly and disabled guards and the Delete handling, checks disabled with
  `:disabled` so an input inside `<fieldset disabled>` is covered, and goes through the whole fix
  process: impact on every OTP variant, the checks, and a PR description with its notes.
  Keys in the PR description, its notes and the reply are `<kbd>` elements.
  A key that changes nothing fires no `input` or `complete` event, checked by counting the events on both sides
  (the merged #43252 missed it; #43255 fixed it).
  Reference: maintainer feedback on #43251 and #43252 (2026-10-31).
