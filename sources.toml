[[source]]
id = "maintainer-pr-description-rules"
kind = "corpus"
private = true
description = "A maintainer's written rules for fix branches and PR descriptions, used for Bootstrap fixes since October 2026"
read = "2026-10-31"
informs = ["bootstrap-fix"]
took = """
One branch per real direction from the upstream base, one or two commits, `dist/` reverted, the
checks the change touches, before and after evidence for a visual change, and a PR description in
plain paragraphs: problem and fix first, a Before | After table, the compiled CSS diff, why this
approach, no reviewer instructions and no list of passing checks. Rewritten; no text copied.
"""

