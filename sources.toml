product = "Claude Code"
name = "/code-review (built-in skill)"
read = "2026-10-31"
informs = ["bootstrap-review"]
took = """
Each finding goes through a verification pass that tries to disprove it, and only findings that
survive are reported. The idea only.
"""

[[source]]
id = "twbs-bootstrap-agents"
