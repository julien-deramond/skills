# Every source a skill took something from, pinned to what was read.
# AGENTS.md ("Sources") says how to keep this file. `informs = []` means the source shaped the
# repository itself, not one skill.

[[source]]
id = "mattpocock-code-review"
kind = "git"
repo = "mattpocock/skills"
path = "skills/engineering/code-review/SKILL.md"
commit = "a496f5513d4a4cf889bc48e189e579f4b0bdf6aa"
license = "MIT"
informs = ["bootstrap-review"]
took = """
The two axes kept apart: spec (does the change do what the issue asked, all of it and nothing more)
and standards (does it follow the repository's own rules), so a pass on one can't hide a fail on the
other. The idea only, rewritten; its code-smell baseline wasn't taken.
"""

[[source]]
id = "claude-code-code-review"
