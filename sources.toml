took = """
Read at run time, never copied: bootstrap-component, bootstrap-component-js, bootstrap-color-system,
bootstrap-utility-api and the migration skills describe how v6 code should be written, which is the
standard a v6 pull request is checked against. When a skill is added or renamed there, update the
table in bootstrap-review's SKILL.md (step 4).
"""

[[source]]
id = "maintainer-review-history"
kind = "corpus"
description = "Julien Déramond's public reviews and comments on 297 twbs/bootstrap pull requests, December 2022 to October 2026"
read = "2026-10-31"
informs = ["bootstrap-review"]
took = """
The recurring checks, ranked by how often they come up (rendering on the deploy preview, a
non-regression diff of the build, the release line, tests for JavaScript, browser support,
accessibility, Sass conventions, docs examples that work in a default build, scope), the tone of the
review, and the first eval cases.
"""

[[source]]
id = "maintainer-triage-method"
kind = "corpus"
private = true
description = "A private maintainers' workspace with written analyses of open twbs/bootstrap pull requests"
read = "2026-10-31"
informs = ["bootstrap-review", "bootstrap-fix"]
took = """
The report's shape (what it is, where it stands, findings, directions, recommendation, next action),
the rules for pull requests from outside contributors, measured evidence (probes written from
scratch, both sides built, computed values in a table), competing directions, and "worth doing?".
Rewritten; no text copied.
"""

